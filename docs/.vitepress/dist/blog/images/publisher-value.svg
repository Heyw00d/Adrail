<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg3)"/>
  
  <!-- Pie chart showing 95/5 split -->
  <circle cx="400" cy="200" r="150" fill="#1e293b"/>
  
  <!-- 95% slice -->
  <path d="M400 200 L400 50 A150 150 0 1 1 377 349 Z" fill="url(#green)"/>
  
  <!-- 5% slice -->
  <path d="M400 200 L377 349 A150 150 0 0 1 400 50 Z" fill="#6366f1"/>
  
  <!-- Center circle -->
  <circle cx="400" cy="200" r="60" fill="#0f172a"/>
  
  <!-- Labels -->
  <text x="320" y="160" font-family="system-ui" font-size="28" font-weight="bold" fill="white">95%</text>
  <text x="320" y="185" font-family="system-ui" font-size="14" fill="#9ca3af">Publisher</text>
  
  <text x="550" y="100" font-family="system-ui" font-size="16" fill="#6366f1">5% AdRail</text>
  
  <!-- Comparison boxes -->
  <rect x="100" y="320" width="120" height="50" fill="#1e293b" rx="8"/>
  <text x="160" y="345" font-family="system-ui" font-size="12" fill="#9ca3af" text-anchor="middle">Legacy: 51%</text>
  <text x="160" y="360" font-family="system-ui" font-size="10" fill="#ef4444" text-anchor="middle">to publisher</text>
  
  <rect x="580" y="320" width="120" height="50" fill="#1e293b" rx="8"/>
  <text x="640" y="345" font-family="system-ui" font-size="12" fill="#9ca3af" text-anchor="middle">AdRail: 95%</text>
  <text x="640" y="360" font-family="system-ui" font-size="10" fill="#22c55e" text-anchor="middle">to publisher</text>
</svg>
