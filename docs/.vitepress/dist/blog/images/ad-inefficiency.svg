      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg2)"/>
  
  <!-- Funnel representing money loss -->
  <path d="M150 80 L650 80 L550 320 L250 320 Z" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  
