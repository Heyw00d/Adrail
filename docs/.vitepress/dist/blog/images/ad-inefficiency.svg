  <rect x="200" y="100" width="400" height="30" fill="#22c55e" rx="4"/>
  <text x="610" y="120" font-family="system-ui" font-size="14" fill="#22c55e">$1.00</text>
  
  <rect x="230" y="150" width="340" height="25" fill="#84cc16" rx="4"/>
  <text x="580" y="167" font-family="system-ui" font-size="12" fill="#84cc16">$0.85</text>
  
  <rect x="260" y="195" width="280" height="22" fill="#eab308" rx="4"/>
  <text x="550" y="210" font-family="system-ui" font-size="11" fill="#eab308">$0.66</text>
  
  <rect x="290" y="235" width="220" height="20" fill="#f97316" rx="4"/>
  <text x="520" y="250" font-family="system-ui" font-size="10" fill="#f97316">$0.53</text>
  
  <rect x="320" y="275" width="160" height="18" fill="#ef4444" rx="4"/>
